name: tests

# Apify builds both Actors automatically on every push to main, so main must
# only ever receive commits that pass these tests. Run them on every pull
# request and on main itself (as a record of what was released).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # matches apify/actor-python in the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests that compare against the platform checkout skip here; they run
      # locally where that checkout exists.
      - run: python -m pytest -q
